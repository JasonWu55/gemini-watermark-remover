server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index dev-preview.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The upstream production landing page redirects to the separately hosted
    # website. The container intentionally exposes the repository's local
    # processing harness as its root page instead.
    location = / {
        try_files /dev-preview.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
