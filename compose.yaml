name: gemini-watermark-remover

services:
  web:
    image: ghcr.io/jasonwu55/gemini-watermark-remover-web:latest
    ports:
      - "${GWR_PORT:-4173}:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
  api:
    image: ghcr.io/jasonwu55/gemini-watermark-remover-api:latest
    ports:
      - "${GWR_API_PORT:-3000}:3000"
    environment:
      GWR_API_TOKEN: "${GWR_API_TOKEN:-}"
      GWR_API_MAX_BYTES: "${GWR_API_MAX_BYTES:-20971520}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  cli:
    profiles:
      - cli
    image: ghcr.io/jasonwu55/gemini-watermark-remover-cli:latest
    working_dir: /data
    volumes:
      - "${GWR_DATA_DIR:-./data}:/data"
    command:
      - --help
    security_opt:
      - no-new-privileges:true
